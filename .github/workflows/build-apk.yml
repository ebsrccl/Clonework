name: Build APK MikroTik

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'server/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Siapkan Node.js untuk pengujian inti
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Uji inti agen dengan data tiruan
        working-directory: server
        run: node --test test/core.test.mjs

      - name: Siapkan Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle 8.13
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Pastikan Android SDK tersedia
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'

      - name: Bangun APK debug
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Periksa tanda tangan dan siapkan berkas
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Mikrotik-Agent-debug.apk
          cd output
          sha256sum Mikrotik-Agent-debug.apk > SHA256SUMS.txt

      - name: Sediakan APK untuk diunduh
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Mikrotik-Agent-APK
          path: output/
          if-no-files-found: error
          retention-days: 14
