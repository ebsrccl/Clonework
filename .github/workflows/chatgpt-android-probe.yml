name: Verify ChatGPT runtime on Android
'on':
  push:
    branches: [chatgpt-local]
    paths: ['android/probe/**', '.github/workflows/chatgpt-android-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-android-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - name: Read pinned official Codex source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openai/codex
          ref: 3d2ee51ca2d5db578f328aa75e20aa22c0197c9a
          persist-credentials: false
      - name: Prepare Rust and Android NDK
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018'
      - name: Check native Android compilation without modifying upstream code
        working-directory: codex-rs
        run: |
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          export AR_aarch64_linux_android="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          # Android needs target-specific lockfile entries absent from the upstream release lock.
          cargo +1.95.0 check --package codex-app-server --bin codex-app-server --target aarch64-linux-android
      - name: Record dependency resolution changes for this feasibility check
        if: always()
        run: git diff --stat -- codex-rs/Cargo.lock
  probe:
    # The packaged Linux runtime gate has already been exercised. Re-run explicitly if needed.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.ci-avd
      ANDROID_USER_HOME: ${{ github.workspace }}/.ci-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Download pinned official runtime and verify SHA-256
        run: |
          curl --fail --location --retry 2 https://github.com/openai/codex/releases/download/rust-v0.153.4/codex-app-server-x86_64-unknown-linux-musl.tar.gz -o /tmp/codex.tar.gz
          echo 'ace0e794c53d0c1abe2fdb9248684904d04b08aca5a7851bc4a7ce0887773cf0  /tmp/codex.tar.gz' | sha256sum --check
          mkdir -p /tmp/codex-runtime android/probe/src/main/jniLibs/x86_64
          tar -xzf /tmp/codex.tar.gz -C /tmp/codex-runtime
          find /tmp/codex-runtime -type f -maxdepth 3
          cp /tmp/codex-runtime/codex-app-server-x86_64-unknown-linux-musl android/probe/src/main/jniLibs/x86_64/libcodex.so
          file android/probe/src/main/jniLibs/x86_64/libcodex.so
          readelf -l android/probe/src/main/jniLibs/x86_64/libcodex.so
      - name: Prepare Android 15 emulator and build probe
        run: |
          sudo chmod a+rw /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0' 'system-images;android-35;google_apis;x86_64' 'emulator'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n probe -k 'system-images;android-35;google_apis;x86_64' --force
          "$ANDROID_HOME/emulator/emulator" -avd probe -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          gradle -p android/probe --no-daemon assembleDebug
      - name: Execute inside normal Android application sandbox
        run: |
          adb wait-for-device
          for attempt in $(seq 1 90); do
            if adb shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1$'; then break; fi
            sleep 3
          done
          adb shell input keyevent 82
          adb install android/probe/build/outputs/apk/debug/*.apk
          adb shell am instrument -w id.mas.codexprobe/id.mas.codexprobe.Probe | tee /tmp/probe-result.txt
          grep -q CODEX_ANDROID_PROBE_PASS /tmp/probe-result.txt
      - name: Runtime diagnostics
        if: always()
        run: |
          adb logcat -d -s CodexProbe AndroidRuntime libc || true
          adb logcat -d -b crash || true
          adb logcat -d -b all | grep -E 'seccomp|SIGSYS|libcodex|Fatal signal' || true
          adb shell run-as id.mas.codexprobe cat files/codex/stderr.txt || true
          tail -30 /tmp/emulator.log || true
