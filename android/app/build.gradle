plugins { id 'com.android.application' }
android {
    namespace 'id.mas.agent'
    compileSdk 36
    defaultConfig {
        applicationId 'id.mas.agent.chatgpt.v4'
        minSdk 26
        targetSdk 36
        testInstrumentationRunner 'id.mas.agent.SmokeProbe'
        versionCode 4
        versionName '0.4.0-multirouter-preview'
    }
    buildFeatures { buildConfig true }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/libcodex.so'] } }
    splits { abi { enable true; reset(); include 'arm64-v8a', 'x86_64'; universalApk false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
